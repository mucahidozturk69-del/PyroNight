<style>

/* ---- in-game HUD */
#cross{position:fixed;left:50%;top:50%;width:16px;height:16px;margin:-8px;border:1px solid #fffb;border-radius:50%;pointer-events:none}

#gear{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:#0b0e1acc;display:grid;place-items:center;cursor:pointer;z-index:6;transition:.15s}

#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 55%,#000 130%);opacity:0}
/* chat */
#chat{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,46vw);z-index:4;pointer-events:none}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#ffffff0a;color:var(--txt);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;transition:.12s}
.btn:hover{background:#ffffff18;border-color:#ffffff55}.btn.on{border-color:var(--acc);color:var(--acc);background:#ffb24a14}.btn.pri{background:var(--acc);border-color:var(--acc);color:#1b1204;font-weight:600}.btn.bad{border-color:#ff6b5788;color:#ff9c8e}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}

.srch{width:100%;margin:2px 0 6px;background:#ffffff0c;border:1px solid var(--line2);color:#fff;padding:9px 12px;border-radius:9px;font:inherit;outline:none}.srch:focus{border-color:var(--acc)}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:11px 2px;font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'▸ ';color:var(--dim)}details[open] summary:before{content:'▾ '}

.card{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#ffffff08;cursor:pointer;transition:.14s;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card .art{height:96px;display:block}.card .t{padding:10px 12px 2px;font-weight:600;font-size:14px}.card .d{padding:0 12px 12px;font-size:12px;color:var(--dim);line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{padding:5px 12px;font-size:12px;border:1px solid var(--line2);border-radius:999px;background:none;cursor:pointer;color:var(--dim)}.chips button.on{color:#1b1204;background:var(--acc);border-color:var(--acc)}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:26px 6px}
.hero h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(40px,7vw,76px);color:#ffe3a8;letter-spacing:.02em;text-shadow:0 0 30px #ff8a1f,0 0 80px #ff3d6e}
.hero p{max-width:520px;color:var(--dim);line-height:1.65;margin:4px 0 12px}
.tip{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.kbd{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;font-size:12px;background:#ffffff0c}

.in{background:#ffffff0c;border:1px solid var(--line2);color:#fff;padding:8px 12px;border-radius:9px;font:inherit;font-size:14px;outline:none}.in:focus{border-color:var(--acc)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#ffffff14;color:var(--dim)}.pill.g{background:#6fdc8c22;color:var(--ok)}.pill.a{background:#ffb24a22;color:var(--acc)}
#fbig{font-size:56px;color:#ffe3a8;font-weight:300}#fg{width:100%;height:90px;background:#0006;border:1px solid var(--line);border-radius:8px}#ftxt{font-size:13px;color:var(--dim);line-height:1.7;margin-top:8px}

.chaos-toggle i{width:18px;height:18px;border-radius:50%;background:#f6f7fb;transition:transform .18s}

.chaos-toggle.on i{transform:translateX(18px)}

 /* Touch controls stay out of the way on desktop and appear only during mobile play. */
